version: 2
updates:
- package-ecosystem: uv
  directory: "/"
  groups:
    uv:
      patterns:
        - "*"
      # Review major upgrades separately.
      update-types:
        - minor
        - patch
  schedule:
    interval: quarterly
  cooldown:
    default-days: 7
  open-pull-requests-limit: 10
- package-ecosystem: github-actions
  directory: "/"
  groups:
    github-actions:
      patterns:
        - "*"  # Group all Actions updates into a single larger pull request
  schedule:
    interval: quarterly
  cooldown:
    default-days: 7
- package-ecosystem: docker
  directory: "/docker"
  groups:
    docker:
      patterns:
        - "*"
      # Review major upgrades separately.
      update-types:
        - minor
        - patch
  schedule:
    interval: quarterly
  cooldown:
    default-days: 7
