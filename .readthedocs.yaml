# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
# Project page: https://readthedocs.org/projects/pythondotorg/

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.14"

  commands:
    - curl --fail --silent --show-error --location https://astral.sh/uv/0.12.17/install.sh --output /tmp/uv-installer.sh
    - env UV_INSTALL_DIR="$HOME/.local/bin" UV_NO_MODIFY_PATH=1 sh /tmp/uv-installer.sh
    - PATH="$HOME/.local/bin:$PATH" make docs DOCS_BUILDDIR="$READTHEDOCS_OUTPUT"
