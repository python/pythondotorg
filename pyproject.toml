[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=84.0.0" ]

[project]
name = "pythondotorg"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4==4.15.0",
    "celery[redis]==5.6.3",
    "chardet==7.6.0",
    "cmarkgfm==2024.11.20",
    "cssselect==1.5.0",
    "dj-database-url==3.1.2",
    "django==5.2.16",
    "django-admin-interface==0.32.0",
    "django-allauth==65.19.3",
    "django-apptemplates==1.5",
    "django-celery-beat==2.9.0",
    "django-countries==8.2.0",
    "django-csp==4.0",
    "django-extensions==4.1",
    "django-filter==26.1",
    "django-haystack==3.4.0",
    "django-honeypot==1.3.0",
    "django-imagekit==6.1.0",
    "django-import-export[ods,xls,xlsx,yaml]==4.4.1",
    "django-markupfield==2.0.1",
    "django-ordered-model==3.7.4",
    "django-pipeline==4.1.0",
    "django-polymorphic==4.11.7",
    "django-sitetree==1.18.1",
    "django-tastypie==0.15.1",
    "django-translation-aliases==0.1.0",
    "django-waffle==5.0.0",
    "django-widget-tweaks==1.5.1",
    "djangorestframework==3.18.1",
    "docutils==0.22.4",
    "elasticsearch>=7,<8",
    "feedparser==6.0.14",
    "icalendar==7.3.0",
    "idna==3.19",
    "lxml==6.1.3",
    "markdown==3.10.3",
    "nh3==0.3.7",
    "num2words==0.5.14",
    "panflute==2.3.1",
    "pillow==12.3.0",
    "psycopg2-binary==2.9.13",
    "pygments>=2.21.0,<3",
    "pypandoc==1.17",
    "python-dateutil==2.9.0.post0",
    "python-decouple==3.8",
    "python3-openid==3.2.0",
    "requests>=2.34.2",
    "sorl-thumbnail==13.1.0",
    "unidecode==1.4.0",
]
[project.optional-dependencies]
prod = [
    "boto3==1.43.93",
    "django-storages==1.14.6",
    "gunicorn==23.0.0",
    "sentry-sdk[django]==2.69.1",
    "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
    "coverage",
    "ddt",
    "django-debug-toolbar==8.0.0",
    "factory-boy==3.3.3",
    "faker==40.38.0",
    "model-bakery==1.24.0",
    "pyproject-fmt==2.29.4",
    "responses==0.26.3",
    "ruff==0.16.7",
    "tblib==1.7.0",
]
docs = [
    "furo",
    "myst-parser",
    "sphinx",
    "sphinx-autobuild",
]

[tool.setuptools]
packages = []

[tool.ruff]
target-version = "py312"
line-length = 120
[tool.ruff.format]
quote-style = "double"
[tool.ruff.lint.per-file-ignores]
# Settings files use star imports (Django convention)
# TODO: will fix later
"pydotorg/settings/*.py" = [ "F403", "F405" ]
# Migrations are auto-generated
"*/migrations/*.py" = [ "D", "N999", "RUF012" ]
# Tests don't need docstrings, can use magic values, hardcoded test passwords
"*/tests/*.py" = [ "D", "N803", "N806", "PLR2004", "S101", "S105", "S106" ]
"*/tests.py" = [ "D", "N803", "N806", "PLR2004", "S101", "S105", "S106" ]
# Management commands don't need docstrings
"*/management/commands/*.py" = [ "D" ]
# conftest files
"conftest.py" = [ "D" ]
"*/conftest.py" = [ "D" ]
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"
[tool.ruff.lint.isort]
known-first-party = [
    "apps",
    "custom_storages",
    "fastly",
    "pydotorg",
]
[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
    # Type annotations - separate project, not practical to add to entire legacy codebase at once
    "ANN",     # flake8-annotations (all ANN rules)
    # Django views/signals/admin methods have required unused args by framework contract
    "ARG001",  # unused-function-argument
    "ARG002",  # unused-method-argument
    # Formatter conflicts (recommended by ruff)
    "COM812",  # trailing comma (conflicts with formatter)
    # Copyright headers are not required by the project's existing source policy
    "CPY001",  # missing-copyright-notice
    # Conflicting docstring rules (pick one style)
    "D203",    # one-blank-line-before-class (conflicts with D211)
    "D213",    # multi-line-summary-second-line (conflicts with D212 - we want summary on first line)
    # Line length handled by formatter
    "E501",    # line too long
    # Boolean args are idiomatic in Django models, forms, and views
    "FBT001",  # boolean-positional-arg-in-function-definition
    "FBT002",  # boolean-default-value-positional-argument
    "FIX",     # flake8-fixme
    "ISC001",  # implicit string concatenation (conflicts with formatter)
    # Circular imports are resolved with local imports in Django
    "PLC0415", # import-outside-top-level
    # Django TestCase uses self.assertEqual, not bare pytest assert
    "PT009",   # pytest-unittest-assertion
    "PT027",   # pytest-unittest-raises-assertion
    # Django model fields are mutable class-level defaults by design
    "RUF012",  # mutable-class-default
    # TODO comment formatting is not worth enforcing
    "TD",      # flake8-todos
]

[tool.pyproject-fmt]
column_width = 120
indent = 4
keep_full_version = true
generate_python_version_classifiers = false
table_format = "long"

[tool.coverage.run]
source = [ "." ]
omit = [
    "*/actions.py",
    "*/admin.py",
    "*/factories.py",
    "*/migrations/*",
    "*/search_indexes.py",
    "*/tests.py",
    "*/tests/*",
    "*venv*",
    "manage.py",
    "pydotorg/compilers.py",
    "pydotorg/settings/*",
    "pydotorg/wsgi.py",
]
branch = true
[tool.coverage.report]
exclude_lines = [
    "def __repr__",
    "def __str__",
    "def get_absolute_url",
    "if __name__ == .__main__.:",
    "if settings.DEBUG",
]
